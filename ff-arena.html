<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FF Arena</title>
<style>
:root{--bg:#0f1218;--cd:#1a2030;--c2:#262f45;--gold:#f5c542;--or:#ff6a00;--tx:#eef1f7;--mu:#8a94aa;--ok:#2ecc71;--er:#ff4757;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h2,h3{margin:0 0 8px}.mu{color:var(--mu);font-size:13px}.g{color:var(--gold)}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.w{padding:12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--c2)}
.logo{font-weight:900;font-size:19px;color:var(--or);letter-spacing:1px}
.card{background:var(--cd);border:1px solid var(--c2);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{background:linear-gradient(135deg,var(--or),var(--gold));color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;font-size:14px}
.btn.o{background:none;color:var(--gold);border:1px solid var(--gold)}.btn.r{background:var(--er);color:#fff}.btn.k{background:var(--ok)}.btn.s{padding:6px 10px;font-size:12px}.btn.f{width:100%}
input,select{width:100%;background:var(--c2);border:1px solid #38425c;color:var(--tx);border-radius:10px;padding:11px;margin:4px 0 8px;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}.tab{white-space:nowrap;padding:7px 13px;border-radius:20px;background:var(--cd);color:var(--mu);border:1px solid var(--c2);cursor:pointer;font-size:13px}.tab.a{background:var(--or);color:#111;font-weight:800;border-color:var(--or)}
.ban{margin:12px;border-radius:14px;padding:18px;min-height:96px;background:linear-gradient(120deg,#3a1d00,#ff6a00 70%,#f5c542);color:#111;font-weight:800;font-size:18px}
.bar{height:8px;background:var(--c2);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--gold))}
.chip{display:inline-block;background:var(--c2);padding:2px 8px;border-radius:8px;font-size:12px;margin-right:4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#141926;border-top:1px solid var(--c2);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav div{flex:1;text-align:center;padding:9px 0;color:var(--mu);font-size:11px;cursor:pointer}.nav div.a{color:var(--gold)}.nav b{display:block;font-size:19px}
.fab{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--or);border:0;font-size:24px;z-index:7;box-shadow:0 0 14px var(--or)}
.mod{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}.mb{background:var(--cd);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:8px 0}.slots button{padding:8px 0;border-radius:6px;border:1px solid #38425c;background:var(--c2);color:var(--tx);font-size:12px}.slots button.x{opacity:.25}.slots button.sel{background:var(--gold);color:#111}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--c2);text-align:left}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st .card{margin:0;text-align:center}.st b{font-size:20px;color:var(--gold);display:block}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:9px 16px;border-radius:20px;z-index:30;font-weight:700}
.pend{color:var(--gold)}.ok{color:var(--ok)}.er{color:var(--er)}.sc{overflow-x:auto}
</style></head><body><div id="app"></div>
<script>
/* OWNER SETTINGS: change these before you publish */
const CFG={adminEmail:'owner@ffarena.app',adminPass:'change-me-123',whatsapp:'https://wa.me/910000000000',telegram:'https://t.me/ffarena_support'};
const H=m=>Date.now()+m*6e4;
const bots=['Shadow','Viper','Ghost','Rogue','Titan','Nova','Blaze','Hawk'];
let S={screen:'auth',tab:'Solo',my:'Upcoming',adm:'Dash',ban:0,notifs:[{t:'Welcome to FF Arena. Room IDs unlock 15 min before start.'}],
users:[{id:'me',ign:'',uid:'',wa:'',lvl:'',wallet:50,played:0,kills:0,won:0,banned:0,ref:'FF'+Math.random().toString(36).slice(2,7).toUpperCase()},...bots.slice(0,5).map((n,i)=>({id:'b'+i,ign:n,uid:'5'+(1e8+i*7777),wallet:0,played:12+i,kills:30+i*9,won:200,banned:0}))],
matches:[],txs:[],deps:[],wds:[],board:bots.map((n,i)=>({n,k:60-i*6,b:5-(i>>1),p:(60-i*6)+(5-(i>>1))*12})),last:null,sel:null};
function mk(o){const m=Object.assign({fee:20,kill:5,booyah:100,slots:48,map:'Bermuda',mode:'TPP',type:'Solo',status:'upcoming',joined:[],room:null},o);m.id=m.id||'m'+Math.random().toString(36).slice(2,7);return m}
S.matches=[mk({title:'Bermuda Solo Blitz',start:H(10),room:{id:'88213',pw:'ff77'},joined:Array.from({length:38},(_,i)=>({slot:i+1,name:bots[i%8]+i,uid:'4'+i,user:'b'+(i%5)}))}),
mk({title:'Purgatory Duo Clash',type:'Duo',map:'Purgatory',mode:'FPP',fee:40,kill:8,booyah:300,slots:24,start:H(120),joined:[{slot:1,name:'Viper',uid:'41',user:'b1'}]}),
mk({title:'Kalahari Squad War',type:'Squad',map:'Kalahari',fee:100,kill:10,booyah:800,slots:12,start:H(300)}),
mk({title:'CS 4v4 Ranked',type:'Clash Squad',map:'Bermuda',fee:30,kill:0,booyah:200,slots:8,start:H(60)}),
mk({title:'Free Daily Match',type:'Free Matches',fee:0,kill:1,booyah:20,start:H(180)})];
const $=s=>document.querySelector(s),me=()=>S.users[0],fm=n=>'₹'+n,go=(s,x)=>{S.screen=s;Object.assign(S,x||{});R()};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function modal(h){closeM();const d=document.createElement('div');d.className='mod';d.id='md';d.onclick=e=>e.target==d&&closeM();d.innerHTML='<div class="mb">'+h+'</div>';document.body.append(d)}
function closeM(){const d=$('#md');d&&d.remove()}
function note(t){S.notifs.unshift({t})}
function tx(t,a){S.txs.unshift({t,a,d:new Date().toLocaleString()})}
function cd(ms){if(ms<=0)return 'LIVE';const s=ms/1e3|0;return(s/3600|0)+'h '+('0'+(s%3600/60|0)).slice(-2)+'m '+('0'+s%60).slice(-2)+'s'}
const v=i=>$('#'+i).value;
function R(){const sc=S.screen,A=$('#app');
if(sc=='auth'||sc=='setup'){A.innerHTML=sc=='auth'?authH():setupH();return}
const nav=[['home','🏠','Home'],['my','🎮','My Matches'],['wallet','💰','Wallet'],['ranks','🏆','Ranks'],['profile','👤','Profile']];
A.innerHTML=`<div class="top"><span class="logo">🔥 FF ARENA</span><span class="row"><b class="g">${fm(me().wallet)}</b><span style="font-size:22px;cursor:pointer" onclick="notifs()">🔔${S.notifs.length?'<sup class="g">'+S.notifs.length+'</sup>':''}</span></span></div>${{home:homeH,my:myH,wallet:walletH,ranks:ranksH,profile:profileH,refer:referH,rules:rulesH,admin:adminH}[sc]()}
<button class="fab" onclick="support()">💬</button><div class="nav">${nav.map(n=>`<div class="${sc==n[0]?'a':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</div>`).join('')}</div>`}
function authH(){return`<div class="w" style="padding-top:50px"><div class="logo" style="font-size:34px;text-align:center">🔥 FF ARENA</div><p class="mu" style="text-align:center">Compete. Kill. Booyah. Get paid.</p>
<div class="card"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn f" onclick="login()">Login / Sign Up</button>
<p class="mu" style="text-align:center">or phone OTP</p><div class="row"><input id="ph" placeholder="Phone number"><button class="btn o s" onclick="toast('OTP sent (demo: 1234)')">Send</button></div><input id="otp" placeholder="OTP"><button class="btn o f" onclick="login()">Verify OTP</button></div>
<button class="btn o f" style="margin-bottom:8px" onclick="login()">Continue with Google</button><button class="btn o f" onclick="login()">Continue with Apple</button></div>`}
function login(){const e=($('#em')||{}).value,p=($('#pw')||{}).value;me().admin=!!(e&&e==CFG.adminEmail&&p==CFG.adminPass);if(me().admin)me().ign=me().ign||'Owner';go(me().ign?'home':'setup')}
function setupH(){return`<div class="w"><h2 class="g">Set up profile</h2><div class="card">IGN<input id="ig" placeholder="In-Game Name">Free Fire UID<input id="ui" inputmode="numeric" placeholder="UID">Level<input id="lv" type="number" placeholder="Level">WhatsApp<input id="wa" placeholder="+91..."> Referral code (optional)<input id="rf" placeholder="Code" value="${new URLSearchParams(location.search).get('ref')||''}"><button class="btn f" onclick="saveP()">Save & Enter</button></div></div>`}
function saveP(){if(!v('ig')||!v('ui'))return toast('IGN and UID required');Object.assign(me(),{ign:v('ig'),uid:v('ui'),lvl:v('lv'),wa:v('wa')});if(v('rf')){me().wallet+=25;tx('Referral bonus',25)}go('home')}
function homeH(){const T=['Solo','Duo','Squad','Clash Squad','Free Matches'],b=['🏆 Mega Booyah Cup — ₹50,000 Prize Pool','📢 Room ID drops 15 min before start','🎁 Refer a friend, earn ₹25'];
return`<div class="ban" id="bn">${b[S.ban%3]}</div><div class="tabs">${T.map(t=>`<span class="tab ${S.tab==t?'a':''}" onclick="go('home',{tab:'${t}'})">${t}</span>`).join('')}</div><div class="w" style="padding-top:0">${S.matches.filter(m=>m.type==S.tab&&m.status!='done').map(card).join('')||'<p class="mu">No matches here yet.</p>'}</div>`}
function card(m){const j=m.joined.length;return`<div class="card"><div class="row sp"><b>${m.title}</b><span class="chip">${m.mode}</span></div><div class="mu">${m.map} · ${m.type}</div>
<div class="row" style="margin:8px 0;flex-wrap:wrap"><span class="chip">Entry ${m.fee?fm(m.fee):'FREE'}</span><span class="chip">Kill ${fm(m.kill)}</span><span class="chip g">Booyah ${fm(m.booyah)}</span></div>
<div class="mu">${new Date(m.start).toLocaleString()} · <b class="g" data-t="${m.start}">${cd(m.start-Date.now())}</b></div><div class="bar"><i style="width:${j/m.slots*100}%"></i></div><div class="mu">${j}/${m.slots} Joined</div>
<div class="row" style="margin-top:8px"><button class="btn" style="flex:1" onclick="joinM('${m.id}')">Join Now</button><button class="btn o" onclick="parts('${m.id}')">View Participants</button></div></div>`}
function parts(id){const m=S.matches.find(x=>x.id==id);modal(`<h3>Participants (${m.joined.length})</h3><table>${m.joined.map(p=>`<tr><td>#${p.slot}</td><td>${p.name}</td></tr>`).join('')||'<tr><td class="mu">Nobody yet</td></tr>'}</table>`)}
function joinM(id){const m=S.matches.find(x=>x.id==id);if(me().banned)return toast('Account banned');if(m.joined.some(p=>p.user=='me'))return toast('Already joined');S.sel=null;
const n={Solo:0,Duo:1,Squad:3,'Clash Squad':3,'Free Matches':0}[m.type],tk=m.joined.map(p=>p.slot);
modal(`<h3>${m.title}</h3><p class="mu">Pick your slot · Entry ${m.fee?fm(m.fee):'FREE'}</p><div class="slots" id="sl">${Array.from({length:m.slots},(_,i)=>`<button class="${tk.includes(i+1)?'x':''}" ${tk.includes(i+1)?'disabled':''} onclick="pick(${i+1},this)">${i+1}</button>`).join('')}</div>
${Array.from({length:n},(_,i)=>`Teammate ${i+1} FF UID<input class="tm" inputmode="numeric" placeholder="UID">`).join('')}<button class="btn f" onclick="conf('${id}',${n})">Confirm & Pay</button>`)}
function pick(n,b){S.sel=n;document.querySelectorAll('#sl button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function conf(id,n){const m=S.matches.find(x=>x.id==id),u=me();if(!S.sel)return toast('Select a slot');if([...document.querySelectorAll('.tm')].some(i=>!i.value))return toast('Enter all teammate UIDs');if(u.wallet<m.fee)return toast('Insufficient balance');
u.wallet-=m.fee;u.played++;if(m.fee)tx('Entry fee: '+m.title,-m.fee);m.joined.push({slot:S.sel,name:u.ign,uid:u.uid,user:'me',team:[...document.querySelectorAll('.tm')].map(i=>i.value)});note('Joined '+m.title+' (slot '+S.sel+')');closeM();toast('Joined!');R()}
function myH(){const f=m=>m.joined.some(p=>p.user=='me'),L=S.matches.filter(f).filter(m=>S.my=='Completed'?m.status=='done':m.status!='done'&&(S.my=='Ongoing'?m.start<=Date.now():m.start>Date.now()));
return`<div class="tabs" style="padding-top:12px">${['Upcoming','Ongoing','Completed'].map(t=>`<span class="tab ${S.my==t?'a':''}" onclick="go('my',{my:'${t}'})">${t}</span>`).join('')}</div><div class="w" style="padding-top:0">${L.map(m=>card(m).replace('>Join Now<',' disabled>Joined ✓<').replace('<button class="btn"','<button class="btn k"')+`<button class="btn o f" style="margin:-4px 0 10px" onclick="room('${m.id}')">🔑 Room ID & Password</button>`).join('')||'<p class="mu">Nothing here.</p>'}</div>`}
function room(id){const m=S.matches.find(x=>x.id==id),ok=m.room&&m.start-Date.now()<=9e5;
modal(ok?`<h3>Room Details</h3>Room ID<div class="row"><input readonly value="${m.room.id}"><button class="btn s" onclick="cp('${m.room.id}')">Copy</button></div>Password<div class="row"><input readonly value="${m.room.pw}"><button class="btn s" onclick="cp('${m.room.pw}')">Copy</button></div>`:`<h3>🔒 Locked</h3><p class="mu">Room ID & password unlock 15 minutes before start${m.room?'.':' once the admin publishes them.'}</p>`)}
function cp(t){navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});toast('Copied')}
function walletH(){return`<div class="w"><div class="card" style="text-align:center"><div class="mu">Wallet Balance</div><h2 class="g" style="font-size:34px">${fm(me().wallet)}</h2><div class="row"><button class="btn" style="flex:1" onclick="addM()">+ Add Money</button><button class="btn o" style="flex:1" onclick="wdM()">Withdraw</button></div></div>
<h3>Payouts</h3>${S.wds.filter(w=>w.u=='me').map(w=>`<div class="card row sp"><span>${fm(w.a)} → ${w.to}</span><b class="${w.s=='Approved'?'ok':w.s=='Rejected'?'er':'pend'}">${w.s}</b></div>`).join('')||'<p class="mu">No withdrawals yet.</p>'}
<h3>Transaction History</h3>${S.txs.map(t=>`<div class="card row sp"><div>${t.t}<div class="mu">${t.d}</div></div><b class="${t.a>0?'ok':'er'}">${t.a>0?'+':''}${t.a}</b></div>`).join('')||'<p class="mu">No transactions.</p>'}</div>`}
function addM(){modal(`<h3>Add Money</h3>Method<select id="pm"><option>UPI – GPay</option><option>UPI – PhonePe</option><option>UPI – Paytm</option><option>bKash</option><option>Nagad</option><option>QR Code</option></select><div class="card" style="text-align:center">Pay to <b class="g">arena@upi</b><div style="font-size:60px">▦</div><span class="mu">Scan QR, pay, then submit TrxID</span></div>Amount<input id="am" type="number" placeholder="₹"> Transaction ID<input id="tr" placeholder="TrxID / UTR"><button class="btn f" onclick="dep()">Submit for Approval</button>`)}
function dep(){const a=+v('am');if(!a||!v('tr'))return toast('Enter amount and TrxID');S.deps.push({u:'me',a,tr:v('tr'),m:v('pm'),s:'Pending'});note('Deposit '+fm(a)+' pending approval');closeM();toast('Submitted');R()}
function wdM(){modal(`<h3>Withdraw</h3><p class="mu">Minimum ₹100</p>Method<select id="wm"><option>UPI</option><option>bKash</option><option>Nagad</option></select>UPI ID / Number<input id="wt"><br>Amount<input id="wa2" type="number"><button class="btn f" onclick="wd()">Request Payout</button>`)}
function wd(){const a=+v('wa2');if(a<100)return toast('Minimum is ₹100');if(a>me().wallet)return toast('Insufficient balance');if(!v('wt'))return toast('Enter payout details');me().wallet-=a;tx('Withdrawal',-a);S.wds.push({u:'me',a,to:v('wt'),s:'Pending'});closeM();R()}
function ranksH(){const r=S.last;return`<div class="w"><h3 class="g">Live Leaderboard</h3><div class="card sc"><table><tr><th>#</th><th>Player</th><th>Kills</th><th>Booyah</th><th>Pts</th></tr>${[...S.board].sort((a,b)=>b.p-a.p).map((x,i)=>`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.k}</td><td>${x.b}</td><td><b>${x.p}</b></td></tr>`).join('')}</table></div>
<h3 class="g">Latest Result</h3>${r?`<div class="card"><b>${r.title}</b><table>${r.results.map(x=>`<tr><td>#${x.rank}</td><td>${x.name}</td><td>${x.k} kills</td><td class="ok">${fm(x.prize)}</td></tr>`).join('')}</table><button class="btn f" style="margin-top:8px" onclick="window.open('https://youtube.com','_blank')">▶ Watch Match / Live Stream</button></div>`:'<p class="mu">No completed matches yet.</p>'}</div>`}
function profileH(){const u=me();return`<div class="w"><div class="card"><h2>${u.ign}</h2><div class="mu">UID ${u.uid} · Lv ${u.lvl||'-'} · WA ${u.wa||'-'}</div></div><div class="st"><div class="card"><b>${u.played}</b>Matches</div><div class="card"><b>${u.kills}</b>Kills</div><div class="card"><b>${fm(u.won)}</b>Winnings</div><div class="card"><b>${fm(u.wallet)}</b>Wallet</div></div><br>
<button class="btn f" onclick="inst()">📲 Install App on My Phone</button><br><br><button class="btn f" onclick="share(me().ref)">🔗 Share App with My Referral Code</button><br><br><button class="btn o f" onclick="go('refer')">🎁 Refer & Earn</button><br><br><button class="btn o f" onclick="go('rules')">📜 Rules & Fair Play</button><br><br>${u.admin?`<button class="btn o f" onclick="go('admin')">🛠 Admin Panel</button><br><br>`:''}<button class="btn r f" onclick="go('auth')">Logout</button></div>`}
function referH(){const c=me().ref;return`<div class="w"><div class="card" style="text-align:center"><h2 class="g">Refer & Earn</h2><p>Friends joining with your code earn you <b class="g">₹25</b> each.</p><h2>${c}</h2><button class="btn f" onclick="share('${c}')">Share Referral Link</button></div></div>`}
function share(c){const t='Join FF Arena! Code '+c+' '+location.origin+location.pathname+'?ref='+c;navigator.share?navigator.share({text:t}).catch(()=>{}):cp(t)}
function rulesH(){return`<div class="w"><h2 class="g">Rules & Fair Play</h2><div class="card"><p>🚫 <b>Anti-hack:</b> Any hack/mod = permanent ban and forfeited balance.</p><p>🚫 <b>No teaming</b> with other squads in Solo/Duo/Squad.</p><p>🚫 <b>No emulators</b> in mobile-only lobbies.</p><p>✅ Room ID is shared 15 min before start. Join on time.</p></div><button class="btn r f" onclick="rep()">🚨 Report Hacker</button></div>`}
function rep(){modal(`<h3>Report Hacker</h3>Player UID<input id="ru">Details<input id="rd">Proof (screenshot / video)<input type="file" accept="image/*,video/*"><button class="btn f" onclick="closeM();toast('Report sent to admins')">Submit Report</button>`)}
function notifs(){modal(`<h3>Notifications</h3>${S.notifs.map(n=>`<div class="card">${n.t}</div>`).join('')}`);S.notifs=[];setTimeout(R,0)}
function support(){modal(`<h3>Customer Support</h3><button class="btn f" onclick="window.open(CFG.whatsapp)">WhatsApp</button><br><br><button class="btn o f" onclick="window.open(CFG.telegram)">Telegram</button><br><br><button class="btn o f" onclick="toast('Live chat connecting…')">Live Chat</button>`)}
/* ---------- ADMIN ---------- */
function adminH(){if(!me().admin)return'<div class="w">Access denied</div>';const T=['Dash','Matches','Payments','Results','Users'],a=S.adm;let b='';
if(a=='Dash')b=`<div class="st"><div class="card"><b>${S.users.length}</b>Users</div><div class="card"><b>${fm(S.deps.filter(d=>d.s=='Approved').reduce((s,d)=>s+d.a,0))}</b>Revenue</div><div class="card"><b>${S.wds.filter(w=>w.s=='Pending').length}</b>Pending Withdrawals</div><div class="card"><b>${S.matches.filter(m=>m.status!='done').length}</b>Active Matches</div></div>`;
if(a=='Matches')b=`<button class="btn f" onclick="mForm()">+ Create Match</button><br><br>${S.matches.map(m=>`<div class="card"><b>${m.title}</b><div class="mu">${m.type} · ${m.map} · ${m.joined.length}/${m.slots} · ${m.status}</div><div class="row" style="margin-top:6px"><button class="btn s" onclick="mForm('${m.id}')">Edit</button><button class="btn s o" onclick="rForm('${m.id}')">Room</button><button class="btn s r" onclick="delM('${m.id}')">Delete</button></div></div>`).join('')}`;
if(a=='Payments')b=`<h3>Deposits</h3>${S.deps.map((d,i)=>`<div class="card"><b>${fm(d.a)}</b> · ${d.m}<div class="mu">TrxID ${d.tr} · ${d.s}</div>${d.s=='Pending'?`<div class="row"><button class="btn s k" onclick="dAct(${i},1)">Approve</button><button class="btn s r" onclick="dAct(${i},0)">Reject</button></div>`:''}</div>`).join('')||'<p class="mu">None</p>'}<h3>Withdrawals</h3>${S.wds.map((w,i)=>`<div class="card"><b>${fm(w.a)}</b> → ${w.to}<div class="mu">${w.s}</div>${w.s=='Pending'?`<div class="row"><button class="btn s k" onclick="wAct(${i},1)">Approve</button><button class="btn s r" onclick="wAct(${i},0)">Reject</button></div>`:''}</div>`).join('')||'<p class="mu">None</p>'}`;
if(a=='Results')b=S.matches.filter(m=>m.status!='done'&&m.joined.length).map(m=>`<div class="card row sp"><span>${m.title}</span><button class="btn s" onclick="resF('${m.id}')">Declare</button></div>`).join('')||'<p class="mu">No matches to declare.</p>';
if(a=='Users')b=S.users.map(u=>`<div class="card row sp"><span>${u.ign||'(unset)'} <span class="mu">${u.uid}</span></span><button class="btn s ${u.banned?'k':'r'}" onclick="ban('${u.id}')">${u.banned?'Unban':'Ban'}</button></div>`).join('');
return`<div class="w"><h2 class="g">Admin Control Center</h2></div><div class="tabs">${T.map(t=>`<span class="tab ${a==t?'a':''}" onclick="go('admin',{adm:'${t}'})">${t}</span>`).join('')}</div><div class="w" style="padding-top:0">${b}</div>`}
function mForm(id){const m=S.matches.find(x=>x.id==id)||{},o=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
modal(`<h3>${id?'Edit':'Create'} Match</h3>Title<input id="t1" value="${m.title||''}">Type<select id="t2">${o(['Solo','Duo','Squad','Clash Squad','Free Matches'],m.type)}</select>Map<select id="t3">${o(['Bermuda','Purgatory','Kalahari'],m.map)}</select>Mode<select id="t4">${o(['TPP','FPP'],m.mode)}</select>Entry fee<input id="t5" type="number" value="${m.fee??20}">Per kill<input id="t6" type="number" value="${m.kill??5}">Booyah prize<input id="t7" type="number" value="${m.booyah??100}">Total slots<input id="t8" type="number" value="${m.slots||48}">Starts in (minutes)<input id="t9" type="number" value="${m.start?Math.round((m.start-Date.now())/6e4):60}"><button class="btn f" onclick="saveM('${id||''}')">Save</button>`)}
function saveM(id){const o={title:v('t1'),type:v('t2'),map:v('t3'),mode:v('t4'),fee:+v('t5'),kill:+v('t6'),booyah:+v('t7'),slots:+v('t8'),start:H(+v('t9'))};if(!o.title)return toast('Title required');const m=S.matches.find(x=>x.id==id);m?Object.assign(m,o):S.matches.push(mk(o));closeM();R()}
function delM(id){S.matches=S.matches.filter(m=>m.id!=id);R()}
function rForm(id){modal(`<h3>Room Details</h3>Room ID<input id="r1">Password<input id="r2"><button class="btn f" onclick="setR('${id}')">Push to Players</button>`)}
function setR(id){const m=S.matches.find(x=>x.id==id);m.room={id:v('r1'),pw:v('r2')};if(m.joined.some(p=>p.user=='me'))note('🔑 Room details updated for '+m.title);closeM();toast('Pushed to joined players');R()}
function dAct(i,ok){const d=S.deps[i];d.s=ok?'Approved':'Rejected';if(ok){me().wallet+=d.a;tx('Deposit ('+d.m+')',d.a)}note('Deposit '+d.s.toLowerCase());R()}
function wAct(i,ok){const w=S.wds[i];w.s=ok?'Approved':'Rejected';if(!ok){me().wallet+=w.a;tx('Withdrawal refund',w.a)}note('Withdrawal '+w.s.toLowerCase());R()}
function ban(id){const u=S.users.find(x=>x.id==id);u.banned=!u.banned;R()}
function resF(id){const m=S.matches.find(x=>x.id==id);modal(`<h3>Declare: ${m.title}</h3><div class="sc"><table><tr><th>Player</th><th>Rank</th><th>Kills</th></tr>${m.joined.map((p,i)=>`<tr><td>${p.name}</td><td><input class="rk" style="width:60px" type="number" value="${i+1}"></td><td><input class="kl" style="width:60px" type="number" value="0"></td></tr>`).join('')}</table></div><button class="btn f" onclick="declare('${id}')">Calculate & Distribute</button>`)}
function declare(id){const m=S.matches.find(x=>x.id==id),rk=[...document.querySelectorAll('.rk')],kl=[...document.querySelectorAll('.kl')];
const res=m.joined.map((p,i)=>{const k=+kl[i].value||0,r=+rk[i].value||99,prize=k*m.kill+(r==1?m.booyah:0),u=S.users.find(x=>x.id==p.user);if(u){u.wallet+=prize;u.kills+=k;u.won+=prize;if(u.id=='me'&&prize)tx('Prize: '+m.title,prize)}return{name:p.name,rank:r,k,prize}}).sort((a,b)=>a.rank-b.rank);
res.forEach(x=>{let b=S.board.find(y=>y.n==x.name);if(!b)S.board.push(b={n:x.name,k:0,b:0,p:0});b.k+=x.k;b.b+=x.rank==1;b.p+=x.k+(x.rank==1?12:0)});
m.status='done';S.last={title:m.title,results:res};note('Results declared: '+m.title);closeM();toast('Prizes distributed');R()}
setInterval(()=>{document.querySelectorAll('[data-t]').forEach(e=>e.textContent=cd(e.dataset.t-Date.now()))},1000);
setInterval(()=>{if(S.screen=='home'){S.ban++;const b=$('#bn');b&&(b.textContent=['🏆 Mega Booyah Cup — ₹50,000 Prize Pool','📢 Room ID drops 15 min before start','🎁 Refer a friend, earn ₹25'][S.ban%3])}},3500);
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function inst(){if(dp){dp.prompt();dp=null}else modal('<h3>Install App</h3><p><b>iPhone:</b> open in Safari → Share → Add to Home Screen.</p><p><b>Android:</b> open in Chrome → ⋮ menu → Install app.</p>')}
R();
</script></body></html>
